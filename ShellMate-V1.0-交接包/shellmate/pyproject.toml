[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shellmate"
version = "1.0.0"
description = "本地命令行助手：自然语言转命令、命令解释、静态风险提示。只生成，不执行。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 刻意保持零第三方依赖：urllib + json + ANSI 全部来自标准库。
# 少一步 pip install，是「部署有多简单」这条核心指标的一部分。
dependencies = []

[project.scripts]
shellmate = "shellmate.app:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
where = ["src"]

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>命令小助手 · SafeShell Pro</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#1f2733; --muted:#6b7686; --line:#e6eaf0;
    --brand:#3b6ef5; --brand-soft:#eaf0ff; --shadow:0 6px 24px rgba(30,50,90,.07);
    --safe:#0f9d58; --safe-bg:#e9f7ef; --caution:#c77700; --caution-bg:#fff4e2;
    --deny:#d93025; --deny-bg:#fdecea; --chip:#f1f4f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3b6ef5,#6a8dff);
    display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(59,110,245,.3)}
  h1{font-size:21px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 22px}
  .notice{display:flex;align-items:center;gap:8px;background:var(--brand-soft);color:#2749a8;
    border:1px solid #d3e0ff;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:22px}
  .notice b{font-weight:700}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}

  .ask{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .ask label{display:block;font-size:13px;font-weight:600;color:#3a4452;margin-bottom:9px}
  .row{display:flex;gap:10px;align-items:stretch}
  textarea{flex:1;resize:vertical;min-height:78px;border:1px solid #d7dde7;border-radius:12px;
    padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;background:#fcfdff;transition:.15s}
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,110,245,.12)}
  button{gap:8px;border:0;border-radius:12px;padding:0 22px;font-size:14.5px;font-weight:600;cursor:pointer;
    background:var(--brand);color:#fff;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
  button:hover:not(:disabled){background:#2f60e0;transform:translateY(-1px)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .examples span{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
  .ex{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
    font-size:12.5px;color:#48546a;cursor:pointer;transition:.15s}
  .ex:hover{background:var(--brand-soft);border-color:#c9d8ff;color:#2749a8}

  .result{display:none;margin-top:22px;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
    box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}
  .explain{font-size:15px;color:#333d4b}
  .cmdbox{display:flex;align-items:center;gap:12px;background:#0f1729;border-radius:12px;padding:14px 16px}
  .cmdbox code{flex:1;color:#e8edf7;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-size:15px;word-break:break-all}
  .copy{background:#24304a;color:#cbd6ea;border-radius:8px;padding:7px 12px;font-size:12.5px;white-space:nowrap}
  .copy:hover{background:#324261;color:#fff}
  .cmd-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
  .cmd-item:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .cmd-item .risk{margin-right:10px}
  .cmd-no{font-size:12px;color:var(--muted);font-weight:600;margin-right:10px}
  .cmdbox.blocked{background:#3a1a1a;opacity:.92}
  .cmdbox.blocked code{color:#ffb4ad;text-decoration:line-through}
  .blocked-tag{background:var(--deny);color:#fff;border-radius:6px;padding:4px 9px;font-size:12px;white-space:nowrap}
  .risk{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700}
  .risk .tag{width:8px;height:8px;border-radius:50%;background:currentColor}
  .risk.SAFE{color:var(--safe);background:var(--safe-bg)}
  .risk.CAUTION{color:var(--caution);background:var(--caution-bg)}
  .risk.DENY{color:var(--deny);background:var(--deny-bg)}
  .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .kv{font-size:12px;color:var(--muted);background:var(--chip);border-radius:8px;padding:5px 10px}
  .kv b{color:#48546a;font-weight:600}

  .sim-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .badge-sim{font-size:11px;color:#2749a8;background:var(--brand-soft);border-radius:999px;padding:4px 10px;font-weight:600}
  .summary{font-size:14.5px;margin:12px 0 16px;color:#2c3644}
  .effects{display:flex;flex-direction:column;gap:9px}
  .effect{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .effect .t{font-weight:600;font-size:13.5px;color:#2c3644}
  .effect .d{font-size:12.5px;color:var(--muted)}
  .effect code{font-family:"SFMono-Regular",Consolas,monospace;background:#eef2f8;border-radius:5px;padding:1px 6px;color:#33415c}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
  .fact{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .fact .l{font-size:11.5px;color:var(--muted)}
  .fact .v{font-size:13.5px;font-weight:600;margin-top:2px}
  .sample{background:#0f1729;color:#cdd7e8;border-radius:10px;padding:13px 15px;margin-top:14px;
    font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-all}
  .warns{margin-top:14px;display:flex;flex-direction:column;gap:7px}
  .warn{background:#fff8ec;border:1px solid #ffe0b2;color:#8a5a00;border-radius:10px;padding:9px 13px;font-size:12.8px}
  .params{display:flex;flex-wrap:wrap;gap:8px}
  .param{background:#fafbfd;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px}
  .param code{font-family:"SFMono-Regular",Consolas,monospace;color:#3b6ef5;font-weight:600}
  .param span{color:var(--muted)}
  .alts{margin:10px 0 0;padding-left:20px;font-size:13px;color:#48546a}
  .alts li{margin:3px 0}
  .err{background:var(--deny-bg);border:1px solid #f5c6c2;color:#a5271e;border-radius:12px;padding:14px 16px;font-size:14px}
  .loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:8px 2px}
  .spin{width:15px;height:15px;border:2px solid #d7dde7;border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{text-align:center;color:#98a2b3;font-size:11.5px;margin-top:26px}
  @media(max-width:560px){.row{flex-direction:column}button{height:46px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⌘</div>
    <div>
      <h1>命令小助手</h1>
      <div class="sub" style="margin:0">用大白话描述你想做的事，我来写命令、并告诉你执行后会发生什么。</div>
    </div>
  </header>

  <div class="notice"><span class="dot"></span><span><b>只生成 · 不执行 · 不隔离</b>　我只会把命令文字展示给你，绝不替你运行；“模拟”只是文字推演，不会真的改动你的电脑。</span></div>

  <div class="ask">
    <label for="q">你想做什么？</label>
    <div class="row">
      <textarea id="q" placeholder="例如：查看当前目录下占用空间最大的 5 个文件"></textarea>
      <button id="go">生成命令</button>
    </div>
    <div class="examples">
      <span>试试：</span>
      <span class="ex">查看大于100M的文件</span>
      <span class="ex">统计当前目录有多少个文件</span>
      <span class="ex">找出最近修改的10个文件</span>
      <span class="ex">删除临时目录下的旧日志</span>
    </div>
  </div>

  <div id="loading" class="loading" style="display:none"><span class="spin"></span>正在思考并推演执行后果…</div>
  <div id="result" class="result"></div>

  <footer>SafeShell Pro · 本地自部署 · 命令由免费大模型生成，安全由本地规则引擎把关</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KIND = {read:"读取",create:"新建",modify:"修改/写入",delete:"删除",network:"网络访问",permission:"权限变更",process:"进程/服务",package:"软件安装",archive:"压缩/解压",blocked:"已拦截",unknown:"未知"};

function effectCard(e){
  return `<div class="effect">
    <div><div class="t">${KIND[e.kind]||"操作"} ${e.target?`<code>${esc(e.target)}</code>`:""}</div>
    <div class="d">${esc(e.detail)}</div></div></div>`;
}

async function ask(){
  const q = $("#q").value.trim();
  if(!q){ $("#q").focus(); return; }
  $("#go").disabled = true; $("#loading").style.display="flex"; $("#result").style.display="none";
  try{
    const resp = await fetch("/api/v1/assistant/generate", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({query:q})
    });
    const data = await resp.json();
    $("#result").innerHTML = render(data);
    $("#result").style.display="block";
  }catch(err){
    $("#result").innerHTML = `<div class="err">请求失败：${esc(err.message)}。请确认服务正在运行。</div>`;
    $("#result").style.display="block";
  }finally{
    $("#go").disabled=false; $("#loading").style.display="none";
  }
}

function riskLabel(r){return r==="SAFE"?"安全 · 只读":r==="CAUTION"?"注意 · 请确认":"危险 · 已拦截";}

function renderCommandBlock(item, idx, total){
  const blocked = item.blocked;
  const text = blocked ? item.original : item.text;
  const badge = `<span class="risk ${esc(item.risk)}"><span class="tag"></span>${riskLabel(item.risk)}</span>`;
  const cmd = blocked
    ? `<div class="cmdbox blocked"><code>${esc(item.original)}</code><span class="blocked-tag">已拦截</span></div>`
    : `<div class="cmdbox"><code>${esc(text)}</code><button class="copy" data-cmd="${esc(text)}" onclick="copyCmd(this)">复制</button></div>`;
  const n = total>1 ? `<span class="cmd-no">第 ${idx+1} / ${total} 条</span>` : "";
  return `<div class="cmd-item">${n}${badge}${cmd}${blocked?`<div class="err" style="margin-top:8px">这条命令命中不可逆规则，已拒绝输出，请勿执行。${item.consequences?esc(item.consequences):""}</div>`:""}</div>`;
}

function render(d){
  if(!d.ok){
    return `<div class="card"><h2>没能生成命令</h2><div class="err">${esc(d.error||"未知错误")}</div>
      ${d.raw_excerpt?`<div class="sample">${esc(d.raw_excerpt)}</div>`:""}</div>`;
  }
  const sim = d.simulation || {};
  const riskCls = esc(d.risk);
  const items = (d.commands && d.commands.length) ? d.commands
    : [{text:d.command, original:d.command, risk:d.risk, blocked:!d.command, simulation:sim}];
  const cmdBlocks = items.map((it,i)=>renderCommandBlock(it,i,items.length)).join("");
  const copyAll = items.length>1 && d.command
    ? `<button class="copy" style="margin-top:10px" data-cmd="${esc(d.command)}" onclick="copyCmd(this)">复制全部 ${items.length} 条</button>` : "";

  const effects = (sim.effects||[]).map(effectCard).join("");
  const params = (d.params||[]).map(p=>`<div class="param"><code>${esc(p.token)}</code> <span>${esc(p.meaning)}</span></div>`).join("");
  const alts = (d.alternatives||[]).length
    ? `<ul class="alts">${d.alternatives.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>` : "";
  const warns = (sim.warnings||[]).map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join("");

  return `
  <div class="card">
    <div class="meta">
      <span class="risk ${riskCls}"><span class="tag"></span>${riskLabel(riskCls)}</span>
      <span class="kv">模型 <b>${esc(d.model)}</b></span>
      ${d.demo?`<span class="kv">演示模式</span>`:""}
      ${d.unverified?`<span class="kv">含未验证命令</span>`:""}
    </div>
    <h2>① 为你生成的命令</h2>
    ${cmdBlocks}
    ${copyAll}
  </div>

  <div class="card">
    <div class="sim-head"><h2 style="margin:0">② 执行后果模拟</h2><span class="badge-sim">仅文字推演 · 不会真的执行</span></div>
    <div class="summary">${esc(sim.summary||"")}</div>
    ${effects?`<div class="effects">${effects}</div>`:""}
    <div class="facts">
      <div class="fact"><div class="l">是否改动系统</div><div class="v">${sim.writes_data?"会改动":"不会改动"}</div></div>
      <div class="fact"><div class="l">能否撤销</div><div class="v">${esc(sim.reversible||"—")}</div></div>
      <div class="fact"><div class="l">访问网络</div><div class="v">${sim.network_access?"会":"不会"}</div></div>
    </div>
    ${sim.sample_output?`<div class="sample">${esc(sim.sample_output)}</div>`:""}
    ${warns?`<div class="warns">${warns}</div>`:""}
  </div>

  <div class="card">
    <h2>③ 这条命令在做什么</h2>
    <div class="explain">${esc(d.explain)}</div>
    ${params?`<h2 style="margin-top:16px">参数拆解</h2><div class="params">${params}</div>`:""}
    ${alts?`<h2 style="margin-top:16px">更安全的做法</h2>${alts}`:""}
  </div>

  <div class="card" style="font-size:12.5px;color:var(--muted)">
    ${esc(d.notice||"")} 模拟结果基于命令文本的静态规则推演，实际情况取决于你的文件、权限与环境；执行与否由你决定。
  </div>`;
}

function copyCmd(btn){
  const code = btn.getAttribute("data-cmd") || btn.parentElement.querySelector("code").textContent;
  navigator.clipboard.writeText(code).then(()=>{
    const old=btn.textContent; btn.textContent="已复制 ✓";
    setTimeout(()=>btn.textContent=old,1400);
  });
}

$("#go").addEventListener("click", ask);
$("#q").addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); ask(); }});
document.querySelectorAll(".ex").forEach(el=>el.addEventListener("click",()=>{ $("#q").value=el.textContent; ask(); }));
</script>
</body>
</html>

# 一键启动：docker compose up --build
# 默认 PROVIDER_MODE=mock（无需任何真实密钥即可体验）；SQLite 落在 ./data 卷内。
# 单端口 8772 同时托管 API 与前端静态资源，无需额外反代。
services:
  app:
    build:
      context: .
      # WSL2 原生 dockerd 的默认 bridge 网络在部分环境无法转发 DNS，
      # 导致构建期 npm ci / pip install 解析失败。构建阶段走宿主机网络，
      # 运行时仍使用 compose 默认 bridge（不受此配置影响）。
      network: host
    container_name: safeshell-pro-app
    ports:
      - "8772:8772"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_ENV: production
      APP_PORT: 8772
      DEMO_MODE: "false"
      DB_PATH: /app/data/margin.db
      LOG_PATH: /app/logs/app.jsonl
      # 前端由镜像内置 dist 托管，同源无需额外 CORS；如需跨域调试可在此追加
      CORS_ORIGINS: http://localhost:8772
    # 网络模式（最终决策，2026-11-15 实测）：
    # WSL2 原生 dockerd 本机部署统一用 host 网络。原因：Windows 主机无法直连
    # WSL IP（vEthernet 不可达），唯一稳定通路是 wslhost 的 localhost 转发；
    # bridge 模式经 docker-proxy 的端口映射在实测中对 localhost 转发时好时坏
    # （返回 000/502），host 模式让网关直接监听 WSL 本机，127.0.0.1:8772 稳定可达。
    # 若需改回 bridge：须先确保 dockerd 未以 --iptables=false 启动（否则缺
    # MASQUERADE/DNAT，容器无法出网），本仓库 install.sh 的 fix-network 会补规则。
    # 注：host 模式下下方 ports 映射会被忽略（容器直接占用宿主机 8772）。
    network_mode: ${SFP_NETWORK_MODE:-host}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8772/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
